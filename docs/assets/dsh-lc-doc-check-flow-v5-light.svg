<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
<title id="title">dsh-lc-doc-check — three reading scopes over one presentation checklist</title>
<desc id="desc">Lane A reads the credit header (lcNo, beneficiary, currency, expiryAt) with LC-006 and LC-007. Lane B reads every row (docType, requirement, presented, discrepancy) with LC-001, LC-002 and LC-005, and compares presentedAt and latestShipment against the same expiryAt with LC-003 and LC-004. Lane C compares docType across rows with LC-008. On the right, findings enter issues[] and checks that cannot run enter skipped[] with their reason; an empty issues list is not a pass.</desc>
